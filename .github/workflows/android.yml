name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "shared/**"
      - "tests/**"
      - "data/static-meta-decks.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Shared logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run

  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Version = mobile/package.json base + the CI run number, e.g.
      # v1.0.0-build.87. run_number only ever increases, so it doubles as the
      # Android versionCode — every APK installs as an upgrade over the last.
      - name: Compute version
        id: version
        run: |
          BASE=$(node -p "require('./mobile/package.json').version")
          echo "name=${BASE}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${BASE}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build web assets
        working-directory: mobile
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            -PappVersionName=${{ steps.version.outputs.name }}

      - name: Rename APK to versioned filename
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk \
             "ygo-deck-builder-${{ steps.version.outputs.tag }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ygo-deck-builder-debug-apk
          path: ygo-deck-builder-${{ steps.version.outputs.tag }}.apk

      # Permanent, versioned release — one per build, never overwritten. The
      # rolling apk-latest release below stays as the easy stable download
      # link; this is the history to roll back to.
      - name: Create versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          body: >
            Android debug build ${{ steps.version.outputs.name }}
            (commit ${{ github.sha }}).
          files: ygo-deck-builder-${{ steps.version.outputs.tag }}.apk

      # Force the rolling tag onto this commit. softprops updates an existing
      # release in place but does NOT move the underlying tag ref, which would
      # otherwise leave apk-latest pinned to the first build's commit (a stale
      # release, and no reliable "did it build?" signal). Moving it here keeps
      # the release pointed at the newest build and makes `tag == HEAD` a valid
      # success check.
      - name: Point apk-latest tag at this commit
        run: |
          git tag -f apk-latest "${GITHUB_SHA}"
          git push -f origin "refs/tags/apk-latest"

      # Rolling "latest" release so the APK is easy to download on a phone:
      # repo page -> Releases -> APK latest -> app-debug.apk
      - name: Update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          target_commitish: ${{ github.sha }}
          name: APK latest
          body: >
            Latest Android debug build from main —
            version ${{ steps.version.outputs.name }}
            (commit ${{ github.sha }}).
            Download app-debug.apk below and open it on your phone to install.
            Older builds live under their own v* releases.
          prerelease: false
          files: mobile/android/app/build/outputs/apk/debug/app-debug.apk
