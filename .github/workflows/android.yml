name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "shared/**"
      - "tests/**"
      - "data/static-meta-decks.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Shared logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run

  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build web assets
        working-directory: mobile
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ygo-deck-builder-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

      # Force the rolling tag onto this commit. softprops updates an existing
      # release in place but does NOT move the underlying tag ref, which would
      # otherwise leave apk-latest pinned to the first build's commit (a stale
      # release, and no reliable "did it build?" signal). Moving it here keeps
      # the release pointed at the newest build and makes `tag == HEAD` a valid
      # success check.
      - name: Point apk-latest tag at this commit
        run: |
          git tag -f apk-latest "${GITHUB_SHA}"
          git push -f origin "refs/tags/apk-latest"

      # Rolling "latest" release so the APK is easy to download on a phone:
      # repo page -> Releases -> APK latest -> app-debug.apk
      - name: Update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          target_commitish: ${{ github.sha }}
          name: APK latest
          body: >
            Latest Android debug build from main
            (commit ${{ github.sha }}).
            Download app-debug.apk below and open it on your phone to install.
          prerelease: false
          files: mobile/android/app/build/outputs/apk/debug/app-debug.apk
