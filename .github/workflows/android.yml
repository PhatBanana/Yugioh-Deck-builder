name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "shared/**"
      - "tests/**"
      - "data/static-meta-decks.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write # allows the run to delete old build artifacts

jobs:
  test:
    name: Shared logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run

  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Version = mobile/package.json base + the CI run number, e.g.
      # v1.0.0-build.87. run_number only ever increases, so it doubles as the
      # Android versionCode — every APK installs as an upgrade over the last.
      - name: Compute version
        id: version
        run: |
          BASE=$(node -p "require('./mobile/package.json').version")
          echo "name=${BASE}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${BASE}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build web assets
        working-directory: mobile
        run: |
          npm ci
          npm run build
          npx cap sync android

      # Release variant, arm-only ABIs — smaller than the old debug builds.
      # R8 minification is currently OFF (see build.gradle) after crashing on
      # a real device; re-enable once that's root-caused. Signed with the
      # same committed keystore, so it upgrades in place.
      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            -PappVersionName=${{ steps.version.outputs.name }}

      - name: Rename APK to versioned filename
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk \
             "ygo-deck-builder-${{ steps.version.outputs.tag }}.apk"

      # The APK is published to the releases below, so a build artifact would
      # just be a redundant copy — and those copies are what fill up the
      # account's Actions storage. Instead of uploading one, purge any left by
      # earlier builds so storage trends back down.
      - name: Purge old build artifacts (reclaim Actions storage)
        uses: actions/github-script@v7
        with:
          script: |
            const arts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            for (const a of arts) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: a.id,
              });
            }
            core.info(`Deleted ${arts.length} old artifact(s).`);

      # Permanent, versioned release — one per build, never overwritten. The
      # rolling apk-latest release below stays as the easy stable download
      # link; this is the history to roll back to.
      - name: Create versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          body: >
            Android build ${{ steps.version.outputs.name }}
            (commit ${{ github.sha }}).
          files: ygo-deck-builder-${{ steps.version.outputs.tag }}.apk

      # Force the rolling tag onto this commit. softprops updates an existing
      # release in place but does NOT move the underlying tag ref, which would
      # otherwise leave apk-latest pinned to the first build's commit (a stale
      # release, and no reliable "did it build?" signal). Moving it here keeps
      # the release pointed at the newest build and makes `tag == HEAD` a valid
      # success check.
      - name: Point apk-latest tag at this commit
        run: |
          git tag -f apk-latest "${GITHUB_SHA}"
          git push -f origin "refs/tags/apk-latest"

      # The upload below only overwrites same-named assets, so any old
      # app-debug.apk from the pre-release-build era would linger next to
      # app-release.apk forever — drop stale assets first.
      - name: Remove stale apk-latest assets
        uses: actions/github-script@v7
        with:
          script: |
            const rel = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: "apk-latest",
            }).catch(() => null);
            for (const a of rel?.data.assets ?? []) {
              if (a.name !== "app-release.apk") {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: a.id,
                });
                core.info(`Deleted stale asset ${a.name}`);
              }
            }

      # Rolling "latest" release so the APK is easy to download on a phone:
      # repo page -> Releases -> APK latest -> app-release.apk
      - name: Update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          target_commitish: ${{ github.sha }}
          name: APK latest
          body: >
            Latest Android build from main —
            version ${{ steps.version.outputs.name }}
            (commit ${{ github.sha }}).
            Download app-release.apk below and open it on your phone to install.
            Older builds live under their own v* releases.
          prerelease: false
          files: mobile/android/app/build/outputs/apk/release/app-release.apk

      # Keep only the 10 most recent versioned build releases (plus the rolling
      # apk-latest). Deletes older ones and their tags so release storage stays
      # bounded instead of growing one APK per build forever.
      - name: Prune old versioned releases (keep last 10)
        uses: actions/github-script@v7
        with:
          script: |
            const KEEP = 10;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            // Versioned build releases only, newest first (listReleases is
            // already sorted by created_at desc).
            const builds = releases.filter((r) => /-build\.\d+$/.test(r.tag_name));
            const stale = builds.slice(KEEP);
            for (const r of stale) {
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: r.id,
              });
              await github.rest.git
                .deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${r.tag_name}`,
                })
                .catch(() => {});
            }
            core.info(`Kept ${Math.min(builds.length, KEEP)} release(s), deleted ${stale.length}.`);
