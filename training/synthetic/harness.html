<!doctype html>
<!-- Render stage for synthetic foil training images. Imports the app's foil
     overlay CSS verbatim (single source — see mobile/src/foil.css) and lays
     one overlay over a catalog card image, exactly like CardThumb does.
     render.mjs drives it: sets the image, the foil class and per-variant
     jitter, then screenshots #stage. -->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../mobile/src/foil.css" />
    <style>
      html,
      body {
        margin: 0;
        background: #1a1a1a;
      }
      #stage {
        position: relative;
        width: 421px; /* native YGOPRODeck card image width */
        line-height: 0;
      }
      #card {
        display: block;
        width: 100%;
        border-radius: 0.375rem;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <img id="card" alt="" />
      <div id="overlay" class="foil"></div>
    </div>
  </body>
</html>
